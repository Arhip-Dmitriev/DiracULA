[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DiracULA"
version = "0.1.0"
description = "Dirac Universal Language for Algorithm: size-agnostic quantum algorithm development in Dirac notation, for any qudit count and dimension"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Arkhip Alekseyevich Dmitriev" }]
# Kept in sync with CITATION.cff.
keywords = [
    "dirac notation",
    "quantum algorithms",
    "quantum programming language",
    "quantum computing",
    "qudit",
    "symbolic quantum",
    "path sums",
    "symbolic algebra",
    "formal verification",
    "lean",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Quantum Computing",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "ArchytasZX>=2.0",
    "numpy",
    "sympy",
]

[project.urls]
Homepage = "https://github.com/Arhip-Dmitriev/DiracULA"
Repository = "https://github.com/Arhip-Dmitriev/DiracULA"
Documentation = "https://github.com/Arhip-Dmitriev/DiracULA/blob/main/docs/INDEX.txt"
Issues = "https://github.com/Arhip-Dmitriev/DiracULA/issues"

[project.scripts]
diracula = "diracula.shell:main"

[project.optional-dependencies]
viz = [
    "matplotlib",
]
dev = [
    "ruff",
    "mypy",
]
bench = [
    "matplotlib",
    "pyzx",
    "qiskit",
]

[tool.setuptools.packages.find]
include = ["diracula*"]
exclude = ["diracula.lean*"]

[tool.setuptools.package-data]
diracula = [
    "lean/*.lean",
    "lean/DiracULA/*.lean",
    "lean/lakefile.toml",
    "lean/lean-toolchain",
    "lean/lake-manifest.json",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
extend-select = ["E501"]
extend-ignore = ["UP040", "UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
